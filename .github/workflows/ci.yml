name: OpenKomodoIDE CI/CD Pipeline

on:
  push:
    branches: [ master, main, test-build-fix ]
  pull_request:
    branches: [ master, main, test-build-fix ]
  workflow_dispatch:

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip python3-venv
        python3 -m pip install --upgrade pip setuptools wheel
    
    - name: Run Python 3 compatibility tests
      run: python3 test_complete_build.py
      
    - name: Run multiplatform tests
      run: python3 test_multiplatform.py
      
    - name: Run Firefox 140 ESR tests
      run: python3 test_firefox_140.py

  build:
    name: Build Process
    runs-on: ubuntu-22.04
    needs: test
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Build Docker image
      run: docker-compose build
      
    - name: Run build in Docker
      run: docker-compose run komodo-build
      
    - name: Upload build artifacts
      if: success()
      uses: actions/upload-artifact@v3
      with:
        name: build-artifacts
        path: |
          build/
          dist/
          logs/

  docker-test:
    name: Docker Tests
    runs-on: ubuntu-22.04
    needs: build
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Build Docker image
      run: docker-compose build
      
    - name: Run tests in Docker
      run: docker-compose run komodo-test

  documentation:
    name: Documentation
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install documentation tools
      run: |
        python3 -m pip install sphinx sphinx-rtd-theme
    
    - name: Build documentation
      run: |
        mkdir -p docs/build
        # Note: This is a placeholder. Actual documentation build would go here.
        echo "Documentation built successfully" > docs/build/index.html
    
    - name: Upload documentation
      uses: actions/upload-artifact@v3
      with:
        name: documentation
        path: docs/build/

  release:
    name: Release
    runs-on: ubuntu-22.04
    needs: [test, build, docker-test, documentation]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: build-artifacts
        path: artifacts/
      
    - name: Create release
      uses: softprops/action-gh-release@v1
      with:
        name: OpenKomodoIDE Build ${{ github.sha }}
        tag_name: build-${{ github.sha }}
        body: |
          Automatic build from commit ${{ github.sha }}
          
          **Build Status**: ✅ All tests passed
          **Platform**: Linux x86_64
          **Python**: 3.11
          **Firefox**: 140.0 ESR
        files: |
          artifacts/**/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notification
    runs-on: ubuntu-22.04
    needs: [test, build, docker-test, documentation]
    if: always()
    
    steps:
    - name: Send notification
      if: failure()
      run: |
        echo "Build failed! Check the workflow run for details."
        # Here you could add actual notification (email, Slack, etc.)
      
    - name: Success notification
      if: success()
      run: |
        echo "Build completed successfully!"
        echo "All tests passed and artifacts are ready."